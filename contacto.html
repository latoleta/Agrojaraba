<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroJaraba | Contacto & Consultoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles-contacto.css">
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-leaf"></i> Agro<span>Jaraba</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="agro-ia.html">Agro IA</a></li>
                <li><a href="importaciones.html">Importaciones</a></li>
                <li><a href="alojamiento.html">Alojamiento</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
        <a href="contacto.html" class="btn-header"><i class="fa-solid fa-headset"></i> Consulta IA</a>
    </header>

    <main class="contacto-wrapper">
        <div class="contacto-card">
            <h2>Contacta con un Asesor</h2>
            <p>Escríbenos para consultas sobre Agro IA, cotizaciones de maquinaria o reservaciones de alojamiento.</p>

            <form action="#">
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label>Área de Interés:</label>
                    <select required>
                        <option value="">-- Selecciona una Opción --</option>
                        <option value="ia">Asistencia de Agro IA</option>
                        <option value="importacion">Importación de Maquinaria</option>
                        <option value="alojamiento">Reserva de Eco-Cabaña</option>
                        <option value="general">Consultoría General</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mensaje o Requerimiento:</label>
                    <textarea rows="4" placeholder="Escribe tu consulta aquí..."></textarea>
                </div>

                <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <span>AgroJaraba</span> - Portal Contacto.</p>
    </footer>

</body>
</html>
